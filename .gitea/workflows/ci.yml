name: CI

permissions:
  contents: read

on:
  push:
    branches: [test]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kvantolingo_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kvantolingo_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: "true"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kvantolingo_ci?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/kvantolingo_ci?schema=public
      AUTH_SECRET: ci-only-7b9c4f6d2a8e1c5f3b7d9a4e6c8f2b5d
      AUTH_URL: http://localhost:3100
      AUTH_TRUST_HOST: "true"
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci_placeholder_service_role_key_0123456789abcdefghijklmnopqrstuvwxyz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify application
        run: npm run verify:ci
