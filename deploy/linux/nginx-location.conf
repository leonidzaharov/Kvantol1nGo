# Include inside the EXISTING HTTPS server block for the new subdomain.
# Configure server_name and TLS certificate in the usual site configuration.
# Do not replace the main college site's virtual host.
client_max_body_size 6m;
location / {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;
    proxy_read_timeout 60s;
    # Do not enable proxy_cache: most pages contain personal data.
}
