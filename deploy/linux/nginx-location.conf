# Include inside the EXISTING HTTPS server block for the new subdomain.
# Configure server_name and TLS certificate in the usual site configuration.
# Do not replace the main college site's virtual host.
client_max_body_size 6m;

# Дополнительный тормоз перебора PIN на уровне nginx: 20 запросов в минуту
# на IP с небольшим burst. Зона объявляется один раз в http-блоке:
#   limit_req_zone $binary_remote_addr zone=pin:10m rate=20r/m;
# Внутри приложения действует свой лимит (LoginAttempt, auth.ts) — этот
# срезает грубый перебор до того, как запрос дойдёт до Node.
location = /api/auth/callback/credentials {
    # limit_req zone=pin burst=10 nodelay;
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;
    proxy_read_timeout 60s;
}

location / {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;
    proxy_read_timeout 60s;
    # Do not enable proxy_cache: most pages contain personal data.
}
